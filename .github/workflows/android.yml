name: Build Native Lap Timer V3 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V3 project
        run: |
          mkdir project
          unzip NativeLapTimer-V3.zip -d project

      - name: Build APK
        working-directory: project/NativeLapTimer
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NativeLapTimer-V3-APK
          path: project/NativeLapTimer/app/build/outputs/apk/debug/app-debug.apk
          
